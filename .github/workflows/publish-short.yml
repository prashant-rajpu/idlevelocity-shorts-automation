name: Generate and publish Idlevelocity Short

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,14 * * *"

permissions:
  contents: write

concurrency:
  group: idlevelocity-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pip install -r requirements.txt
      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
        run: python src/generate.py
      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python src/upload.py
      - name: Save publishing history
        run: |
          git config user.name "idlevelocity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json data/provider_quotas.json 2>/dev/null || true
          git commit -m "chore: record published Short [skip ci]" || exit 0
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-short
          path: output/
          retention-days: 7

